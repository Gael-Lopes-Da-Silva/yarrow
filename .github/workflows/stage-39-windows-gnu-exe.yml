# Stage 39 gate: Windows-gnu host→host AOT executable link.
#
# Runs on a native Windows-gnu toolchain (MSYS2 MinGW64). Does not fake PE
# link on linux hosts.

name: stage-39-windows-gnu-exe

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-gnu-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-cargo
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkgconf

      - name: Show toolchain
        run: |
          rustc -vV
          cargo -V
          ld --version | head -n1
          gcc -print-file-name=crt2.o

      - name: Build yarrow-core
        run: cargo build -p yarrow_core

      - name: Stage 39 gate (compile + run 01_hello.exe)
        run: cargo run -p yarrow_core --example check_windows_exe

      - name: Clippy
        run: cargo clippy -p yarrow_core --examples -- -D warnings
