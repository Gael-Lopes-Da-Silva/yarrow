[package]
name = "yarrow_fmt"
version = "0.1.0"
edition = "2024"
description = "Formatter for Yarrow (.yar) source"

[[bin]]
name = "yarrow-fmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12"
yarrow_core = { version = "0.1.0", path = "../yarrow-core" }
