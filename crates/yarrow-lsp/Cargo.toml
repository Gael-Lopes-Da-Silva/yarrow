[package]
name = "yarrow_lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for Yarrow (.yar)"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
tower-lsp-server = "0.23"
yarrow_core = { path = "../yarrow-core" }
yarrow_fmt = { path = "../yarrow-fmt" }
